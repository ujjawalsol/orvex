[package]
name = "rust-bench"
version = "0.1.0"
edition = "2021"

# Phase 4 Part 6: minimal comparable native prototype (gnu toolchain + local gcc).
# Build: cargo build --release --target x86_64-pc-windows-gnu
# Run: ./target/x86_64-pc-windows-gnu/release/rust-bench.exe --reps 10
# Ops mirror bench/ops_win.py + CacheRequest/uncached paths (same workloads).

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
